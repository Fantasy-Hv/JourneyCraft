spring:
  application:
    name: JourneyCraft

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/journeycraft?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:123456}

  # MongoDB 配置
  # H2 控制台（开发测试用）
  h2:
    console:
      enabled: true
  mongodb:
    uri: mongodb://localhost:27017/journeycraft_diary

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Spring Security + JWT 配置
jwt:
  secret: ${JWT_SECRET:journeyCraftSecretKeyForJWTTokenGeneration2024}
  expiration: 86400000 # 24 小时
  header: Authorization
  prefix: Bearer

# Knife4j/Swagger 配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: journeycraft

# 服务端口
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    org.dsgroup.journeycraft: DEBUG
